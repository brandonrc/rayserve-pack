[project]
name = "cm-rayjob"
version = "0.1.0"
description = "POC: checkmaite JobBackend implemented on KubeRay RayJob CRs (Tier-3 isolation)"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Driver side: CR CRUD + watch + pod logs. No Ray client needed at all —
    # that is one of the selling points of this design.
    "kubernetes>=29.0.0",
    # Protocol types (JobStatus, CapabilityRunRef, Job/JobBackend protocols)
    # and, in the capability entrypoint, the execution core
    # (_execute_capability_ref). checkmaite is a dependency, never a fork.
    "checkmaite==0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cm_rayjob"]
